name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  schedule:
    - cron: '17 6 * * *' # Daily at 06:17 UTC (11:17 in Pakistan)
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Restore last successful headline snapshot
        uses: actions/cache@v4
        with:
          path: data/tech-headlines.json
          key: tech-headlines-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: tech-headlines-
      - name: Test news feed handling
        run: python3 -m unittest discover -s scripts -p 'test_*.py'
      - name: Refresh official publisher headlines
        run: python3 scripts/update-tech-news.py
      - run: npm ci
      - name: Test news sitemap dates and XML
        run: node scripts/test-news-discovery.cjs
      - run: npm run build
        env:
          GITHUB_PAGES: 'true'
      - name: Check published pages, links, and RSS
        run: python3 scripts/check-export.py
      - run: touch out/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
